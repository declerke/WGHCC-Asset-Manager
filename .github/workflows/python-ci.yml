name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Install application requirements
        run: python -m pip install -r requirements.txt

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q wghcc_asset_manager.py

      - name: Run spreadsheet round-trip test
        run: python -m unittest discover -s tests -v

      - name: Audit declared dependencies
        run: pip-audit --requirement requirements.txt --progress-spinner off
